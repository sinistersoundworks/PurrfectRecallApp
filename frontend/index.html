<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Subjects</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">
    <div class="section">
      <h1>Subjects</h1>

      <input id="name" placeholder="name">
      <input id="description" placeholder="description">
      <button onclick="createSubject()">Add</button>

      <button onclick="loadSubjects()">Refresh</button>

      <ul id="list"></ul>
    </div>

    
      <h2>Create Flashcard</h2>
      <select id="subjectSelect"></select>
      <input id="question" placeholder="question">
      <input id="answer" placeholder="answer">
      <button onclick="createFlashcard()">Create Flashcard</button>
      <button onclick="loadFlashcards()">Show Flashcards</button>

    </div class="section">
      <h2>Flashcards</h2>
      <ul id="flashcardList"></ul>
    </div>

      <script>
        const API = "http://127.0.0.1:8000";
        const SUBJECTS_API = `${API}/subjects`;
        const FLASHCARDS_API = `${API}/flashcards`;

        async function loadSubjects() {
          const response = await fetch(SUBJECTS_API);
          const subjects = await response.json();

          const list = document.getElementById("list");
          list.innerHTML = "";

          const select = document.getElementById('subjectSelect');
          select.innerHTML = '';

          subjects.forEach(subject => {
            const li = document.createElement("li");

            li.innerHTML = `
              ${subject.name}: ${subject.description}
              <button onclick="editSubject(${subject.id}, '${subject.name}', '${subject.description}')">Edit</button>
              <button onclick="deleteSubject(${subject.id})">Delete</button>
            `;

            list.appendChild(li);

            const opt = document.createElement('option');
            opt.value = subject.id;
            opt.textContent = subject.name;
            select.appendChild(opt);
          });
        }

        async function createSubject() {
          const name = document.getElementById("name").value;
          const description = document.getElementById("description").value;

          await fetch(SUBJECTS_API, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ name, description })
          });

          await loadSubjects();
        }

        async function createFlashcard() {
          const subject_id = document.getElementById('subjectSelect').value;
          const question = document.getElementById('question').value;
          const answer = document.getElementById('answer').value;

          if (!subject_id) return alert('Select a subject first');

          const res = await fetch(FLASHCARDS_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ subject_id: Number(subject_id), question, answer })
          });

          if (!res.ok) {
            const err = await res.text();
            return alert('Error: ' + res.status + ' ' + err);
          }

          alert('Flashcard created');
          document.getElementById('question').value = '';
          document.getElementById('answer').value = '';
          await loadFlashcards();
        }

        async function loadFlashcards() {
          const subjectId = document.getElementById('subjectSelect').value;
          const url = subjectId ? `${FLASHCARDS_API}?subject_id=${subjectId}` : FLASHCARDS_API;
          const res = await fetch(url);
          if (!res.ok) return alert('Failed to load flashcards: ' + res.status);
          const cards = await res.json();

          const ul = document.getElementById('flashcardList');
          ul.innerHTML = '';

          cards.forEach(card => {
            const li = document.createElement('li');
            li.innerHTML = `
              <strong>${card.question}</strong> — ${card.answer}
              (subject: ${card.subject_id})
              <button onclick="editFlashcard(${card.id}, ${card.subject_id}, '${escapeJs(card.question)}', '${escapeJs(card.answer)}')">Edit</button>
              <button onclick="deleteFlashcard(${card.id})">Delete</button>
            `;
            ul.appendChild(li);
          });
        }

        function escapeJs(str) {
          if (!str) return '';
          return str.replaceAll("'", "\\'").replaceAll('\n','\\n');
        }

        async function editFlashcard(id, subject_id, oldQuestion, oldAnswer) {
          const question = prompt('Question:', oldQuestion);
          const answer = prompt('Answer:', oldAnswer);
          if (question === null || answer === null) return;

          const res = await fetch(`${FLASHCARDS_API}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ subject_id, question, answer })
          });

          if (!res.ok) return alert('Edit failed: ' + res.status);
          await loadFlashcards();
        }

        async function deleteFlashcard(id) {
          if (!confirm('Delete this flashcard?')) return;
          const res = await fetch(`${FLASHCARDS_API}/${id}`, { method: 'DELETE' });
          if (!res.ok) return alert('Delete failed: ' + res.status);
          await loadFlashcards();
        }

        async function deleteSubject(id) {
          const confirmDelete = confirm("Are you sure you want to delete this subject?");
          if (!confirmDelete) return;

          await fetch(`${SUBJECTS_API}/${id}`, {
            method: "DELETE"
          });

          loadSubjects();
        }

        async function editSubject(id, oldName, oldDescription) {
          const name = prompt("New name:", oldName);
          const description = prompt("New description:", oldDescription);

          if (!name) return;

          await fetch(`${SUBJECTS_API}/${id}`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ name, description })
          });

          loadSubjects();
        }

        loadSubjects();
      </script>
      
  </div>
</body>
</html>
