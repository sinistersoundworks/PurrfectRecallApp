name: PurrfectRecall
options:
  bundleIdPrefix: com.purrfectrecall
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  PurrfectRecallKit:
    path: PurrfectRecallKit
targets:
  PurrfectRecallMac:
    type: application
    platform: macOS
    sources:
      - path: PurrfectRecallMac
    dependencies:
      - package: PurrfectRecallKit
        product: PurrfectRecallKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.purrfectrecall.mac
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
      INFOPLIST_KEY_CFBundleDisplayName: "Purrfect Recall"
  PurrfectRecallIOS:
    type: application
    platform: iOS
    sources:
      - path: PurrfectRecallIOS
    dependencies:
      - package: PurrfectRecallKit
        product: PurrfectRecallKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.purrfectrecall.ios
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
      INFOPLIST_KEY_CFBundleDisplayName: "Purrfect Recall"
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
